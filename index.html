<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>קניות</title>
<!-- גרסה 4 -->
<meta name="theme-color" content="#2E6F4E">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="קניות">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Suez+One&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8EDE5; --card:#FBFCF9; --ink:#1B2A20; --muted:#6E7C6F;
  --green:#2E6F4E; --green-dark:#22553B; --amber:#E8A317; --amber-soft:#FDF3DC;
  --tomato:#C2371F; --line:#D2DACE;
  --shadow:0 1px 2px rgba(27,42,32,.06), 0 6px 18px rgba(27,42,32,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Heebo',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.45;padding-bottom:130px;overscroll-behavior-y:contain}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

header{position:sticky;top:0;z-index:30;background:var(--green);color:#fff;
  padding:calc(env(safe-area-inset-top) + 9px) 14px 0;box-shadow:0 2px 14px rgba(27,42,32,.16)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:'Suez One',serif;font-weight:400;font-size:20px;margin:0;line-height:1.2}
.count{font-size:12px;opacity:.85;margin-top:0;font-weight:500}
.hbtns{display:flex;align-items:center;gap:6px;flex:none}
.whoami{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);
  border-radius:999px;padding:5px 10px 5px 8px;font-size:12.5px;font-weight:500}
.iconbtn{width:33px;height:33px;flex:none;border-radius:50%;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:17px;height:17px}
.iconbtn:active{background:rgba(255,255,255,.28)}
.dot{width:8px;height:8px;border-radius:50%;background:#8FE3B0;flex:none}
.dot.off{background:var(--amber)} .dot.bad{background:#FF9B8A}
.tabs{display:flex;gap:20px;margin-top:6px}
.tab{padding:7px 1px 8px;font-size:14.5px;font-weight:500;color:rgba(255,255,255,.6);
  border-bottom:3px solid transparent}
.tab.on{color:#fff;font-weight:700;border-bottom-color:var(--amber)}

.composer{background:var(--paper);padding:9px 12px 7px}
.composer.slim .opts,.composer.slim .extra{display:none}
.addrow{display:flex;gap:7px}
.addrow input[type=text]{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);
  border-radius:12px;padding:11px 13px;outline:none}
.addrow input[type=text]:focus{border-color:var(--green)}
.addbtn{background:var(--green);color:#fff;border-radius:12px;width:47px;flex:none;
  font-size:24px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.addbtn:active{background:var(--green-dark)}
.opts{display:flex;gap:6px;margin-top:7px;align-items:center}
.opts input[type=text]{width:76px;flex:none;background:var(--card);border:1.5px solid var(--line);
  border-radius:11px;padding:9px 10px;outline:none;font-size:14px}
.opts select{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);
  border-radius:11px;padding:9px 10px;font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
.chipbtn{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:11px;
  padding:9px 11px;font-size:14px;font-weight:500;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--tomato);border-color:var(--tomato);color:#fff}
.chipbtn.note[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.extra{display:none;gap:7px;margin-top:8px}
.extra.show{display:flex}
.extra input{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);
  border-radius:11px;padding:9px 11px;font-size:14px;outline:none}
.extra input[type=date]{flex:none;width:150px}

.favwrap{padding:0 0 6px;border-bottom:1px solid var(--line)}
.favlabel{display:none}
.favs{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding:0 12px 2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.favs::-webkit-scrollbar{display:none}
.favs::before{content:'★';color:var(--amber);font-size:14px;align-self:center;flex:none;padding-left:1px}
.fav{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;
  font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:5px;flex:none;white-space:nowrap}
.fav:active{background:#EFF4EC;border-color:var(--green)}
.fav .x{color:var(--muted);font-size:16px;line-height:1}
.fav.empty{color:var(--muted);border-style:dashed;font-weight:400}

main{padding:4px 12px 0}
.cat{margin-top:11px}
.cathead{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.catname{font-family:'Suez One',serif;font-weight:400;font-size:13px;background:var(--ink);
  color:var(--paper);padding:1px 9px;border-radius:5px}
.catline{flex:1;height:0;border-top:1.5px dashed var(--line)}
.catnum{font-size:12px;color:var(--muted);font-weight:700}

.item{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:7px 10px;margin-bottom:4px;box-shadow:var(--shadow);
  transition:opacity .18s ease, transform .12s ease}
.item:active{transform:scale(.988)}
.item.urgent{border-right:4px solid var(--tomato)}
.item.done{opacity:.5;box-shadow:none}
.check{width:23px;height:23px;flex:none;border-radius:50%;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.check svg{width:13px;height:13px;opacity:0;transition:opacity .15s}
.item.done .check{background:var(--green);border-color:var(--green)}
.item.done .check svg{opacity:1}
.body{flex:1;min-width:0}
.name{font-weight:500;font-size:15px;line-height:1.3;word-break:break-word}
.item.done .name{text-decoration:line-through}
.meta{font-size:11.5px;line-height:1.3;color:var(--muted);margin-top:1px;display:flex;gap:6px;
  flex-wrap:wrap;align-items:center}
.note{color:var(--ink);opacity:.72}
.datepill{background:var(--amber-soft);color:#8A5D00;border:1px solid #F0DCA8;
  border-radius:5px;padding:0 5px;font-size:11px;font-weight:700}
.qty{background:#EFF4EC;color:var(--green-dark);border-radius:5px;padding:0 6px;font-weight:700;font-size:12px}
.more{color:var(--muted);font-size:18px;padding:2px 3px;flex:none;line-height:1;letter-spacing:1px}
.star{color:var(--amber);font-size:12px;flex:none}

.empty{text-align:center;color:var(--muted);padding:52px 24px;font-size:15px}
.empty b{display:block;font-family:'Suez One',serif;font-weight:400;font-size:19px;color:var(--ink);margin-bottom:6px}
.clearbtn{display:block;width:100%;margin:20px 0 8px;background:none;border:1.5px dashed var(--line);
  border-radius:13px;padding:13px;color:var(--muted);font-size:14.5px;font-weight:500}
.clearbtn:active{background:var(--card)}

.bigbtn{display:block;width:100%;background:var(--green);color:#fff;border-radius:14px;
  padding:15px;font-weight:700;font-size:16px;margin:14px 0 4px;box-shadow:var(--shadow)}
.bigbtn:active{background:var(--green-dark)}
.bigbtn[disabled]{background:var(--line);color:var(--muted);box-shadow:none}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  margin-bottom:9px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.rcard:active{transform:scale(.99)}
.rname{font-family:'Suez One',serif;font-weight:400;font-size:17.5px}
.rsub{font-size:13px;color:var(--muted);margin-top:2px}
.chev{color:var(--line);font-size:22px;flex:none}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14.5px;
  font-weight:500;padding:12px 0 2px}
.rtitle{font-family:'Suez One',serif;font-weight:400;font-size:24px;margin:4px 0 2px}
.rnote{font-size:14px;color:var(--muted);margin-bottom:12px}
.hint{font-size:13.5px;color:var(--muted);background:var(--card);border:1px dashed var(--line);
  border-radius:11px;padding:10px 12px;margin:10px 0 12px}
.ing{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:11px 13px;margin-bottom:7px}
.ing.off{opacity:.45}
.ing .name{font-size:16px}
.box{width:25px;height:25px;flex:none;border-radius:7px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center}
.ing.on .box{background:var(--green);border-color:var(--green)}
.box svg{width:14px;height:14px;opacity:0}
.ing.on .box svg{opacity:1}
.formrow{margin-bottom:9px}
.formrow label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.formrow input,.formrow select{width:100%;background:var(--card);border:1.5px solid var(--line);
  border-radius:12px;padding:12px;outline:none}
.formrow input:focus,.formrow select:focus{border-color:var(--green)}
.igrow{display:flex;gap:6px;margin-bottom:7px;align-items:center}
.igrow input.n{flex:1;min-width:0}
.igrow input.q{width:66px;flex:none}
.igrow select{flex:none;width:112px;-webkit-appearance:none;appearance:none}
.igrow input,.igrow select{background:var(--card);border:1.5px solid var(--line);
  border-radius:11px;padding:10px;font-size:14px;outline:none}
.igrow .rm{color:var(--muted);font-size:19px;padding:2px 4px;flex:none}
.addig{width:100%;border:1.5px dashed var(--line);border-radius:12px;padding:11px;
  color:var(--muted);font-size:14.5px;font-weight:500;margin-top:2px}
.danger{width:100%;background:none;border:1.5px solid #EFC9C2;color:var(--tomato);
  border-radius:13px;padding:13px;font-weight:500;margin-top:10px}
.ghost{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:13px;
  padding:13px;font-weight:500;margin-top:8px}

.pcomp{background:var(--paper);padding:9px 12px 8px;border-bottom:1px solid var(--line)}
.pdel{color:var(--muted);font-size:17px;padding:2px 4px;flex:none;line-height:1}
.pchip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;
  padding:6px 11px;font-size:13px;font-weight:500;color:var(--green-dark)}
.pchip:active{background:#EFF4EC;border-color:var(--green)}
.rthumb{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.rimg{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin:8px 0 6px;display:block;background:var(--line)}
.sech{font-family:'Suez One',serif;font-weight:400;font-size:17px;margin:18px 0 6px}
.steps{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 12px 4px;margin-bottom:8px}
.steps ol{margin:0;padding-right:22px}
.steps li{margin-bottom:9px;line-height:1.55}
.steps p{margin:0 0 9px;line-height:1.55}
.srclink{display:block;font-size:13px;color:var(--muted);margin:6px 0;word-break:break-all}
.formrow textarea{width:100%;min-height:160px;background:var(--card);border:1.5px solid var(--line);
  border-radius:12px;padding:12px;outline:none;line-height:1.5;resize:vertical}
.formrow textarea:focus{border-color:var(--green)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:11px;
  padding:10px 4px;font-size:14px;font-weight:500}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.impin{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;outline:none}
textarea.impin{min-height:200px;line-height:1.5}
.filelbl{display:block;text-align:center;width:100%;background:var(--card);border:1.5px dashed var(--line);
  border-radius:13px;padding:16px;font-weight:500;color:var(--green-dark);cursor:pointer}
.filelbl input{display:none}
.imgpick{display:flex;gap:10px;align-items:center}
.imgpick .filelbl{padding:12px;flex:1}
.imgpick .rthumb{width:64px;height:64px}
.minibtn{color:var(--tomato);font-size:13.5px;padding:6px 4px;flex:none}
.ver{text-align:center;font-size:11.5px;color:var(--muted);opacity:.75;margin:26px 0 6px}
#banner{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);right:14px;left:14px;z-index:60;
  background:var(--ink);color:var(--paper);border-radius:13px;padding:12px 15px;font-size:14px;
  box-shadow:0 8px 26px rgba(27,42,32,.28);display:none}
#banner.show{display:block}

#sheetWrap{position:fixed;inset:0;z-index:80;display:none}
#sheetWrap.show{display:block}
.scrim{position:absolute;inset:0;background:rgba(27,42,32,.42)}
.sheet{position:absolute;right:0;left:0;bottom:0;background:var(--paper);
  border-radius:20px 20px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);
  max-height:88vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(27,42,32,.24)}
.grab{width:42px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}
.sheet h3{font-family:'Suez One',serif;font-weight:400;font-size:20px;margin:0 0 12px}

#gate{position:fixed;inset:0;z-index:100;background:var(--green);display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:32px;text-align:center;color:#fff}
#gate.show{display:flex}
#gate h2{font-family:'Suez One',serif;font-weight:400;font-size:30px;margin:0 0 6px}
#gate p{margin:0 0 26px;opacity:.85;font-size:15px}
#gate input{width:100%;max-width:300px;background:rgba(255,255,255,.15);
  border:1.5px solid rgba(255,255,255,.35);border-radius:13px;padding:14px;color:#fff;
  text-align:center;font-size:17px;outline:none}
#gate input::placeholder{color:rgba(255,255,255,.6)}
#gate button{margin-top:12px;width:100%;max-width:300px;background:#fff;color:var(--green);
  border-radius:13px;padding:14px;font-weight:700;font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="gate">
  <h2>מי קונה?</h2>
  <p>השם יופיע ליד פריטים שתוסיפי לרשימה</p>
  <input id="gateName" type="text" placeholder="השם שלך" autocomplete="off">
  <button id="gateGo">נכנסים לרשימה</button>
</div>

<header>
  <div class="hrow">
    <div>
      <h1>רשימת קניות</h1>
      <div class="count" id="count">טוען…</div>
    </div>
    <div class="hbtns">
      <button class="iconbtn" id="waBtn" aria-label="שליחה לוואטסאפ" title="שליחה לוואטסאפ">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.19 8.19 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.79.97-.14.16-.29.18-.54.06-.25-.13-1.05-.39-1.99-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.47c-.16 0-.43.06-.65.31-.22.25-.85.83-.85 2.03s.87 2.35.99 2.51c.12.16 1.71 2.61 4.14 3.66.58.25 1.03.4 1.38.51.58.19 1.11.16 1.53.1.47-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.11-.22-.17-.47-.29Z"/></svg>
      </button>
      <button class="whoami" id="whoami"><span class="dot" id="dot"></span><span id="meName">—</span></button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="list">הרשימה</button>
    <button class="tab" data-tab="recipes">מתכונים</button>
    <button class="tab" data-tab="plan">תכנון</button>
  </div>
</header>

<div id="composerWrap">
  <div class="composer slim" id="composer">
    <div class="addrow">
      <input id="itemName" type="text" placeholder="מה צריך לקנות?" autocomplete="off" enterkeyhint="done">
      <button class="addbtn" id="addBtn" aria-label="הוספה">+</button>
    </div>
    <div class="opts">
      <input id="itemQty" type="text" placeholder="כמות" autocomplete="off">
      <select id="itemCat"></select>
      <button class="chipbtn note" id="noteBtn" aria-pressed="false">הערה</button>
      <button class="chipbtn" id="urgBtn" aria-pressed="false">דחוף</button>
    </div>
    <div class="extra" id="extraRow">
      <input id="itemNote" type="text" placeholder="הערה (לא חובה)" autocomplete="off">
      <input id="itemDate" type="date" style="display:none">
    </div>
  </div>
  <div class="favwrap">
    <div class="favlabel">פריטים קבועים · נגיעה מוסיפה לרשימה</div>
    <div class="favs" id="favs"></div>
  </div>
</div>

<div id="planWrap" class="pcomp" style="display:none">
  <div class="addrow">
    <input id="planName" type="text" placeholder="מה מבשלים לשבת?" autocomplete="off" enterkeyhint="done">
    <button class="addbtn" id="planAdd" aria-label="הוספה לתכנון">+</button>
  </div>
</div>

<main id="main"></main>

<div id="banner"></div>
<div id="sheetWrap"><div class="scrim" data-close="1"></div><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';

var SUPABASE_URL = 'https://jicqslxgzpcaqptffyie.supabase.co';
var SUPABASE_KEY = 'sb_publishable_UnLQ8CH_KXTaXHl_5ExK4g_6Q-Pn-sQ';

var APP_VER = '4';
var MEDS = 'תרופות';
var CATS = ['ירקות ופירות','חלב וביצים','בשרים','דגים','לחם ומאפים','יבשים ושימורים','קפואים',
            'משקאות','חטיפים ומתוקים','ניקיון','טואלטיקה','לבית',MEDS,'עלי אקספרס/חו"ל','לתינוק','אחר'];

var sb=null, me='', items=[], favs=[], recipes=[], ring=[], plan=[], planErr=false, chan=null;
var urgent=false, showNote=false;
var view='list', curRecipe=null, sel={}, draft=null, lock=false;
var $=function(id){return document.getElementById(id);};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
var bT=null;
function banner(msg,ms){var b=$('banner');b.textContent=msg;b.classList.add('show');
  clearTimeout(bT); if(ms!==0) bT=setTimeout(function(){b.classList.remove('show');}, ms||2800);}
function setDot(s){$('dot').className='dot'+(s==='ok'?'':s==='sync'?' off':' bad');}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}}
function cache(){try{localStorage.setItem('kniot_cache',JSON.stringify(
  {items:items,favs:favs,recipes:recipes,ring:ring,plan:plan}));}catch(e){}}
function loadCache(){try{var c=JSON.parse(localStorage.getItem('kniot_cache')||'null');
  if(c){items=c.items||[];favs=c.favs||[];recipes=c.recipes||[];ring=c.ring||[];plan=c.plan||[];}}catch(e){}}
function fmtDate(s){if(!s)return '';var p=String(s).slice(0,10).split('-');
  return p.length===3?(p[2]+'/'+p[1]):String(s);}
function catOptions(selected){return CATS.map(function(c){
  return '<option'+(c===selected?' selected':'')+'>'+esc(c)+'</option>';}).join('');}

function fetchAll(silent){
  if(!sb) return Promise.resolve();
  return Promise.all([
    sb.from('items').select('*').order('created_at',{ascending:true}),
    sb.from('favorites').select('*').order('name',{ascending:true}),
    sb.from('recipes').select('*').order('name',{ascending:true}),
    sb.from('recipe_items').select('*').order('sort',{ascending:true}),
    sb.from('plan').select('*').order('created_at',{ascending:true})
  ]).then(function(r){
    for(var i=0;i<4;i++){ if(r[i].error) throw r[i].error; }
    items=r[0].data||[]; favs=r[1].data||[]; recipes=r[2].data||[]; ring=r[3].data||[];
    if(r[4].error) planErr=true; else { planErr=false; plan=r[4].data||[]; }
    cache(); setDot('ok'); render();
  }).catch(function(err){
    setDot('bad');
    if(!silent){
      var m=(err&&err.message)?err.message:'';
      if(/relation|does not exist|column|schema/i.test(m))
        banner('המבנה במסד הנתונים לא מעודכן. צריך להריץ את קוד ה-SQL החדש ב-Supabase.',0);
      else banner('אין חיבור לשרת — מוצגת הרשימה השמורה במכשיר');
    }
    render();
  });
}

function addItem(o){
  var name=(o.name||'').trim(); if(!name) return null;
  var row={name:name, qty:(o.qty||'').trim()||null, category:o.category||'אחר',
           urgent:!!o.urgent, done:false, added_by:me,
           note:(o.note||'').trim()||null, buy_from:o.buy_from||null};
  items.push(Object.assign({id:'tmp-'+Date.now()+Math.random(),created_at:new Date().toISOString()},row));
  return row;
}
function pushNew(o){
  var row=addItem(o); if(!row) return;
  render(); buzz();
  sb.from('items').insert(row).then(function(r){
    if(r.error) banner('לא הצלחתי להוסיף את "'+row.name+'". נסי שוב.');
    fetchAll(true);
  });
}
function toggle(id){
  var it=items.filter(function(x){return x.id===id;})[0]; if(!it) return;
  it.done=!it.done; render(); buzz();
  sb.from('items').update({done:it.done}).eq('id',id).then(function(){fetchAll(true);});
}
function saveItem(id,patch){
  var it=items.filter(function(x){return x.id===id;})[0]; if(it) Object.assign(it,patch);
  render();
  sb.from('items').update(patch).eq('id',id).then(function(r){
    if(r.error) banner('העדכון לא נשמר.'); fetchAll(true);});
}
function delItem(id){
  items=items.filter(function(x){return x.id!==id;}); render();
  sb.from('items').delete().eq('id',id).then(function(){fetchAll(true);});
}
function clearDone(){
  var n=items.filter(function(x){return x.done;}).length; if(!n) return;
  if(!confirm('למחוק '+n+' פריטים שכבר נקנו?')) return;
  items=items.filter(function(x){return !x.done;}); render();
  sb.from('items').delete().eq('done',true).then(function(){fetchAll(true);});
}
function isFav(n){return favs.some(function(f){return f.name===n;});}
function toggleFav(name,cat){
  var f=favs.filter(function(x){return x.name===name;})[0];
  if(f){ favs=favs.filter(function(x){return x.name!==name;}); render();
    sb.from('favorites').delete().eq('id',f.id).then(function(){fetchAll(true);}); }
  else { favs.push({id:'tmp-'+Date.now(),name:name,category:cat||'אחר'}); render(); buzz();
    sb.from('favorites').insert({name:name,category:cat||'אחר'}).then(function(){fetchAll(true);}); }
}

var CHECK='<svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>';

function itemHTML(it){
  var cls='item'+(it.done?' done':'')+(it.urgent&&!it.done?' urgent':'');
  var meta='';
  if(it.buy_from) meta+='<span class="datepill">מ־'+esc(fmtDate(it.buy_from))+'</span>';
  if(it.note) meta+='<span class="note">'+esc(it.note)+'</span>';
  if(it.added_by) meta+='<span>'+esc(it.added_by)+'</span>';
  if(it.urgent&&!it.done) meta+='<span>דחוף</span>';
  if(isFav(it.name)) meta+='<span class="star">★</span>';
  return '<div class="'+cls+'" data-id="'+esc(it.id)+'">'+
    '<button class="check" data-act="toggle" aria-label="סימון">'+CHECK+'</button>'+
    '<div class="body" data-act="toggle"><div class="name">'+esc(it.name)+'</div>'+
      (meta?'<div class="meta">'+meta+'</div>':'')+'</div>'+
    (it.qty?'<span class="qty">'+esc(it.qty)+'</span>':'')+
    '<button class="more" data-act="edit" aria-label="עוד">⋯</button></div>';
}

function listView(){
  var open=items.filter(function(x){return !x.done;});
  var done=items.filter(function(x){return x.done;});
  $('count').textContent = open.length ? (open.length+' פריטים לקנות'+(done.length?' · '+done.length+' בסל':''))
                          : (items.length?'הכל בסל 🎉':'הרשימה ריקה');
  if(!items.length) return '<div class="empty"><b>הרשימה ריקה</b>מה שתוסיפו כאן יופיע מיד אצל שניכם</div>';
  var html='', order=CATS.slice();
  open.forEach(function(it){ if(order.indexOf(it.category)===-1) order.push(it.category); });
  order.forEach(function(cat){
    var g=open.filter(function(x){return x.category===cat;}); if(!g.length) return;
    g.sort(function(a,b){ if(!!b.urgent!==!!a.urgent) return b.urgent?1:-1;
      return String(a.created_at).localeCompare(String(b.created_at)); });
    html+='<div class="cat"><div class="cathead"><span class="catname">'+esc(cat)+'</span>'+
      '<span class="catline"></span><span class="catnum">'+g.length+'</span></div>'+
      g.map(itemHTML).join('')+'</div>';
  });
  if(done.length){
    html+='<div class="cat"><div class="cathead"><span class="catname">כבר בסל</span>'+
      '<span class="catline"></span><span class="catnum">'+done.length+'</span></div>'+
      done.map(itemHTML).join('')+
      '<button class="clearbtn" id="clearBtn">ניקוי '+done.length+' פריטים שנקנו</button></div>';
  }
  return html;
}

/* ---------- תכנון ---------- */
function addPlan(name){
  name=(name||'').trim(); if(!name) return false;
  if(plan.some(function(x){return !x.done && x.name===name;})){ banner('"'+name+'" כבר בתכנון'); return false; }
  var row={name:name, done:false, added_by:me};
  plan.push(Object.assign({id:'tmp-'+Date.now()+Math.random(),created_at:new Date().toISOString()},row));
  render(); buzz();
  sb.from('plan').insert(row).then(function(r){
    if(r.error) banner('לא הצלחתי להוסיף לתכנון. אם זו הפעם הראשונה — צריך להריץ את קוד ה-SQL.');
    fetchAll(true);
  });
  return true;
}
function togglePlan(id){
  var it=plan.filter(function(x){return x.id===id;})[0]; if(!it) return;
  it.done=!it.done; render(); buzz();
  sb.from('plan').update({done:it.done}).eq('id',id).then(function(){fetchAll(true);});
}
function delPlan(id){
  plan=plan.filter(function(x){return x.id!==id;}); render();
  sb.from('plan').delete().eq('id',id).then(function(){fetchAll(true);});
}
function clearPlan(){
  if(!plan.length) return;
  if(!confirm('לנקות את כל רשימת התכנון?')) return;
  plan=[]; render();
  sb.from('plan').delete().neq('name','').then(function(){fetchAll(true);});
}
function planView(){
  var open=plan.filter(function(x){return !x.done;});
  var done=plan.filter(function(x){return x.done;});
  $('count').textContent = plan.length ? (open.length+' לבשל'+(done.length?' · '+done.length+' הוכנו':'')) : 'עוד לא תוכנן כלום';
  var html='';
  if(planErr) html+='<div class="hint">כדי שהתכנון יישמר צריך להריץ פעם אחת את קוד ה-SQL של טבלת התכנון ב-Supabase.</div>';
  if(!plan.length) return html+'<div class="empty"><b>מה מבשלים לשבת?</b>כתבי למעלה, או היכנסי למתכון ולחצי "הוספה לתכנון"</div>';
  var row=function(it){
    return '<div class="item'+(it.done?' done':'')+'" data-pid="'+esc(it.id)+'">'+
      '<button class="check" data-act="ptoggle" aria-label="סימון">'+CHECK+'</button>'+
      '<div class="body" data-act="ptoggle"><div class="name">'+esc(it.name)+'</div></div>'+
      '<button class="pdel" data-act="pdel" aria-label="מחיקה">✕</button></div>';
  };
  if(open.length) html+='<div class="cat"><div class="cathead"><span class="catname">לבשל</span>'+
    '<span class="catline"></span><span class="catnum">'+open.length+'</span></div>'+open.map(row).join('')+'</div>';
  if(done.length) html+='<div class="cat"><div class="cathead"><span class="catname">הוכן ✓</span>'+
    '<span class="catline"></span><span class="catnum">'+done.length+'</span></div>'+done.map(row).join('')+'</div>';
  html+='<button class="clearbtn" data-act="pclear">ניקוי כל הרשימה (לשבת הבאה)</button>';
  return html;
}

function stepsHTML(t){
  var ls=String(t||'').split(/\n+/).map(function(s){return s.trim();}).filter(Boolean);
  var out='<div class="steps">', open=false;
  ls.forEach(function(l){
    if(/[:：]$/.test(l) && l.length<40){ if(open){out+='</ol>';open=false;} out+='<p><b>'+esc(l)+'</b></p>'; return; }
    if(!open){ out+='<ol>'; open=true; } out+='<li>'+esc(l)+'</li>';
  });
  if(open) out+='</ol>';
  return out+'</div>';
}

function render(){
  var fw=$('favs');
  if(!favs.length) fw.innerHTML='<span class="fav empty">פריטים קבועים — נשמרים דרך ⋯</span>';
  else fw.innerHTML=favs.map(function(f){
    return '<button class="fav" data-fav="'+esc(f.name)+'" data-cat="'+esc(f.category||'אחר')+'">'+
      esc(f.name)+'<span class="x" data-act="unfav">✕</span></button>';}).join('');

  $('composerWrap').style.display = (view==='list')?'':'none';
  $('planWrap').style.display = (view==='plan')?'':'none';
  var tv=(view==='list'||view==='plan')?view:'recipes';
  [].forEach.call(document.querySelectorAll('.tab'),function(t){
    t.classList.toggle('on', t.getAttribute('data-tab')===tv);});

  if(view==='edit' && !draft){ view=curRecipe?'recipe':'recipes'; lock=false; }
  if(lock && view==='edit') return;
  var VER='<div class="ver">גרסה '+APP_VER+'</div>';
  if(view==='list') $('main').innerHTML=listView()+VER;
  else if(view==='plan') $('main').innerHTML=planView()+VER;
  else if(view==='recipes') $('main').innerHTML=recipesView()+VER;
  else if(view==='recipe') $('main').innerHTML=recipeView()+VER;
  else if(view==='edit'){ $('main').innerHTML=recipeEditView()+VER; lock=true; }
}

/* ---------- תמונות ---------- */
function shrink(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file), im=new Image();
    im.onload=function(){
      var M=1000, w=im.naturalWidth, h=im.naturalHeight, k=Math.min(1,M/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u);
      c.toBlob(function(b){ b?res({blob:b,url:c.toDataURL('image/jpeg',.7)}):rej(); },'image/jpeg',.82);
    };
    im.onerror=function(){ URL.revokeObjectURL(u); rej(); };
    im.src=u;
  });
}
function uploadImg(blob){
  var path='r'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  var st=sb.storage.from('recipe-images');
  return st.upload(path,blob,{contentType:'image/jpeg',upsert:false}).then(function(r){
    if(r.error) throw r.error;
    return st.getPublicUrl(path).data.publicUrl;
  });
}
document.addEventListener('change',function(e){
  if(e.target.id!=='dImgFile'||!e.target.files||!e.target.files[0]||!draft) return;
  collectDraft();

      var f=e.target.files&&e.target.files[0]; if(!f) return;
      stat('מכין את התמונה…');
      ocrImage(f,stat).then(function(txt){
        if(!txt.trim()) throw new Error('empty');
        draftFromParsed(parseRecipeText(txt));
      }).catch(function(){ stat('לא הצלחתי לקרוא את צילום המסך. נסי את הטיפ של "הדבקת טקסט".'); });
    });
  }
}
/* חשיפה לבדיקות */
window.__kniot={parseIng:parseIng,parseRecipeText:parseRecipeText,parseRecipeHTML:parseRecipeHTML};

function openRecipe(id){
  curRecipe=id; sel={};
  ingsOf(id).forEach(function(i){ sel[i.id]=true; });
  view='recipe'; render();
}
function collectDraft(){
  if(!draft) return;
  var nEl=$('dName'), noEl=$('dNote');
  if(nEl) draft.name=nEl.value;
  if(noEl) draft.note=noEl.value;
  var inEl=$('dIns'); if(inEl) draft.instructions=inEl.value;
  [].forEach.call(document.querySelectorAll('.igrow'),function(row){
    var i=+row.getAttribute('data-ig');
    if(!draft.ings[i]) return;
    draft.ings[i].name=row.querySelector('.n').value;
    draft.ings[i].qty=row.querySelector('.q').value;
    draft.ings[i].category=row.querySelector('select').value;
  });
}
function startEdit(id){
  if(id){
    var r=recipes.filter(function(x){return x.id===id;})[0]; if(!r) return;
    draft={id:r.id,name:r.name,note:r.note||'',instructions:r.instructions||'',image_url:r.image_url||'',
      source_url:r.source_url||'',ings:ingsOf(r.id).map(function(i){
      return {name:i.name,qty:i.qty||'',category:i.category||'אחר'};})};
    if(!draft.ings.length) draft.ings=[{name:'',qty:'',category:'אחר'}];
  } else {
    draft={id:null,name:'',note:'',instructions:'',image_url:'',source_url:'',ings:[{name:'',qty:'',category:'אחר'},{name:'',qty:'',category:'אחר'}]};
  }
  view='edit'; lock=false; render();
}
function saveRecipe(){
  collectDraft();
  var name=(draft.name||'').trim();
  if(!name){ banner('צריך שם למתכון'); var e=$('dName'); if(e) e.focus(); return; }
  var ings=draft.ings.filter(function(g){return (g.name||'').trim();})
    .map(function(g,i){return {name:g.name.trim(), qty:(g.qty||'').trim()||null,
      category:g.category||'אחר', sort:i};});
  var note=(draft.note||'').trim()||null;
  lock=false;
  var d=draft;
  banner('שומר…',0);
  var p=(d.imgBlob ? uploadImg(d.imgBlob).catch(function(){
      banner('התמונה לא נשמרה — המתכון יישמר בלעדיה'); return d.image_url||null; })
    : Promise.resolve(d.image_url||null)).then(function(img){
    var rec={name:name, note:note, instructions:(d.instructions||'').trim()||null,
      image_url:img||null, source_url:(d.source_url||'').trim()||null};
    if(d.id){
      return sb.from('recipes').update(rec).eq('id',d.id).then(function(r){
        if(r.error) throw r.error;
        return sb.from('recipe_items').delete().eq('recipe_id',d.id); })
        .then(function(){ return d.id; });
    }
    return sb.from('recipes').insert(rec).select().then(function(r){
      if(r.error||!r.data||!r.data[0]) throw (r.error||new Error('no id'));
      return r.data[0].id; });
  });
  p.then(function(rid){
    if(!ings.length) return rid;
    ings.forEach(function(g){ g.recipe_id=rid; });
    return sb.from('recipe_items').insert(ings).then(function(){ return rid; });
  }).then(function(rid){
    curRecipe=null; sel={}; view='recipes'; draft=null; lock=false;
    banner('"'+name+'" נשמר. אפשר להוסיף עוד מתכון או לבחור מתכון להכנה.');
    render();
    return fetchAll(true);
  }).catch(function(err){
    var m=(err&&err.message)||'';
    if(/column|schema|instructions|image_url|source_url/i.test(m))
      banner('צריך להריץ ב-Supabase את קוד ה-SQL של גרסה 3 (תמונה ואופן הכנה).',0);
    else banner('השמירה נכשלה. בדקי חיבור ונסי שוב.');
    if(!draft){ view=curRecipe?'recipe':'recipes'; lock=false; render(); }
  });
}
function delRecipe(){
  if(!draft||!draft.id) return;
  if(!confirm('למחוק את המתכון "'+draft.name+'"?')) return;
  var id=draft.id; draft=null; lock=false; view='recipes';
  recipes=recipes.filter(function(r){return r.id!==id;}); render();
  sb.from('recipe_items').delete().eq('recipe_id',id).then(function(){
    return sb.from('recipes').delete().eq('id',id); }).then(function(){ fetchAll(true); });
}
function addRecipeToList(){
  var ings=ingsOf(curRecipe).filter(function(i){return sel[i.id];});
  if(!ings.length) return;
  var openNames={};
  items.forEach(function(x){ if(!x.done) openNames[x.name]=1; });
  var rows=[], dup=0;
  ings.forEach(function(i){
    if(openNames[i.name]){ dup++; return; }
    var row=addItem({name:i.name, qty:i.qty||'', category:i.category||'אחר'});
    if(row) rows.push(row);
  });
  view='list'; render(); slim(true); buzz();
  if(!rows.length){ banner('כל המצרכים כבר ברשימה'); return; }
  sb.from('items').insert(rows).then(function(r){
    if(r.error) banner('חלק מהמצרכים לא נוספו. נסי שוב.');
    else banner(rows.length+' מצרכים נוספו לרשימה'+(dup?' · '+dup+' כבר היו בה':''));
    fetchAll(true);
  });
}

document.addEventListener('click',function(e){
  var t=e.target;
  var closest=function(s){ return t.closest?t.closest(s):null; };

  if(closest('[data-close]')){ closeSheet(); return; }

  var tab=closest('.tab');
  if(tab){ var v=tab.getAttribute('data-tab');
    view=(v==='list'||v==='plan')?v:'recipes'; draft=null; lock=false; render(); return; }

  var act=t.getAttribute('data-act')||(closest('[data-act]')?closest('[data-act]').getAttribute('data-act'):null);

  var favBtn=closest('.fav[data-fav]');
  if(favBtn){ var nm=favBtn.getAttribute('data-fav');
    if(act==='unfav'){ toggleFav(nm); return; }
    pushNew({name:nm,category:favBtn.getAttribute('data-cat')}); return; }

  if(t.id==='clearBtn'){ clearDone(); return; }

  if(act==='newRecipe'){ startEdit(null); return; }
  if(act==='importRecipe'){ openImport('link'); return; }
  if(act==='rmImg'){ collectDraft(); draft.image_url=''; draft.imgBlob=null; draft.imgPreview='';
    lock=false; render(); return; }
  if(act==='toRecipes'){ view='recipes'; render(); return; }
  if(act==='editRecipe'){ startEdit(curRecipe); return; }
  if(act==='cancelEdit'){ draft=null; lock=false;
    view=curRecipe?'recipe':'recipes'; render(); return; }
  if(act==='addIg'){ collectDraft(); draft.ings.push({name:'',qty:'',category:'אחר'});
    lock=false; render(); var rows=document.querySelectorAll('.igrow');
    if(rows.length) rows[rows.length-1].querySelector('.n').focus(); return; }
  if(act==='rmIg'){ collectDraft(); var i=+closest('.igrow').getAttribute('data-ig');
    draft.ings.splice(i,1); if(!draft.ings.length) draft.ings=[{name:'',qty:'',category:'אחר'}];
    lock=false; render(); return; }
  if(act==='saveRecipe'){ saveRecipe(); return; }
  if(act==='delRecipe'){ collectDraft(); delRecipe(); return; }
  if(act==='addRecipe'){ addRecipeToList(); return; }
  if(act==='planRecipe'){ var pr=recipes.filter(function(x){return x.id===curRecipe;})[0];
    if(pr && addPlan(pr.name)) banner('"'+pr.name+'" נוסף לתכנון'); return; }
  if(act==='planCard'){ var pn=closest('[data-rname]').getAttribute('data-rname');
    if(addPlan(pn)) banner('"'+pn+'" נוסף לתכנון'); return; }
  if(act==='pclear'){ clearPlan(); return; }
  var prow=closest('[data-pid]');
  if(prow){ var pid=prow.getAttribute('data-pid');
    if(act==='pdel') delPlan(pid); else if(act==='ptoggle') togglePlan(pid); return; }

  var rc=closest('[data-recipe]');
  if(rc){ openRecipe(rc.getAttribute('data-recipe')); return; }

  var ig=closest('[data-ing]');
  if(ig){ var iid=ig.getAttribute('data-ing'); sel[iid]=!sel[iid]; render(); buzz(); return; }

  var row=closest('.item');
  if(!row) return;
  var id=row.getAttribute('data-id');
  if(act==='edit') openSheet(id);
  else if(act==='toggle') toggle(id);
});

function submitNew(){
  var cat=$('itemCat').value;
  pushNew({name:$('itemName').value, qty:$('itemQty').value, category:cat, urgent:urgent,
           note:$('itemNote').value, buy_from:(cat===MEDS&&$('itemDate').value)?$('itemDate').value:null});
  $('itemName').value=''; $('itemQty').value=''; $('itemNote').value='';
  urgent=false; $('urgBtn').setAttribute('aria-pressed','false');

/* composer opens on focus, closes when done and empty */
function slim(on){ $('composer').classList.toggle('slim',on); }
$('itemName').addEventListener('focus',function(){ slim(false); });
$('composer').addEventListener('focusin',function(){ slim(false); });
$('composer').addEventListener('focusout',function(){
  setTimeout(function(){
    if($('composer').contains(document.activeElement)) return;
    if($('itemName').value.trim()||$('itemQty').value.trim()||$('itemNote').value.trim()) return;
    slim(true);
  },120);

/* export to WhatsApp */
function listText(){
  var open=items.filter(function(x){return !x.done;});
  if(!open.length) return '';
  var order=CATS.slice();
  open.forEach(function(it){ if(order.indexOf(it.category)===-1) order.push(it.category); });
  var out=['🛒 רשימת קניות',''];
  order.forEach(function(cat){
    var g=open.filter(function(x){return x.category===cat;}); if(!g.length) return;
    g.sort(function(a,b){ if(!!b.urgent!==!!a.urgent) return b.urgent?1:-1;
      return String(a.created_at).localeCompare(String(b.created_at)); });
    out.push('*'+cat+'*');
    g.forEach(function(i){
      var l='• '+i.name;
      if(i.qty) l+=' – '+i.qty;
      if(i.buy_from) l+=' (מ־'+fmtDate(i.buy_from)+')';
      if(i.note) l+=' ('+i.note+')';
      if(i.urgent) l+=' ‼️';
      out.push(l);
    });
    out.push('');
  });
  return out.join('\n').trim();
}
$('waBtn').addEventListener('click',function(){
  var txt=listText();
  if(!txt){ banner('הרשימה ריקה — אין מה לשלוח'); return; }
  try{ window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank'); }
  catch(e){
    if(navigator.clipboard) navigator.clipboard.writeText(txt);
    banner('הרשימה הועתקה — אפשר להדביק בוואטסאפ');
  }
});

function subscribe(){
  if(!sb) return;
  try{ if(chan) sb.removeChannel(chan); }catch(e){}
  chan=sb.channel('kniot-sync');
  ['items','favorites','recipes','recipe_items','plan'].forEach(function(tb){
    chan=chan.on('postgres_changes',{event:'*',schema:'public',table:tb},function(){fetchAll(true);});
  });
  chan.subscribe(function(st){
    if(st==='SUBSCRIBED') setDot('ok');
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT') setDot('sync');});
}
setInterval(function(){ if(!document.hidden && !lock) fetchAll(true); },7000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden && !lock) fetchAll(true); });
window.addEventListener('online',function(){ fetchAll(true); subscribe(); });

function start(){
  $('meName').textContent=me; $('gate').classList.remove('show');

  try{
    var qp=new URLSearchParams(location.search).get('import');
    if(qp){ history.replaceState(null,'',location.pathname); view='recipes'; render(); openImport('link');
      var mm=qp.match(/https?:\/\/\S+/); $('impUrl').value=mm?mm[0]:qp; $('impGo').click(); }
  }catch(e){}
}
$('gateGo').addEventListener('click',function(){

  me=v; try{localStorage.setItem('kniot_me',me);}catch(e){} start();});

$('itemCat').innerHTML=catOptions('אחר');

if(!window.supabase||!window.supabase.createClient)
  banner('טעינת ספריית החיבור נכשלה. בדקי חיבור לאינטרנט ורענני.',0);
else sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

try{ me=localStorage.getItem('kniot_me')||''; }catch(e){}
if(me) start(); else $('gate').classList.add('show');

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
})();
